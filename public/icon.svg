<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1a17"/>
      <stop offset="100%" stop-color="#090807"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4"/>
  
  <!-- Outer luxury emblem ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 8"/>
  
  <!-- APEX Pyramid / Chevron monogram -->
  <g filter="url(#glow)">
    <path d="M 256 108 L 380 350 L 324 350 L 256 210 L 188 350 L 132 350 Z" fill="url(#goldGrad)"/>
    <!-- Inner diamond accent -->
    <polygon points="256,260 286,320 256,366 226,320" fill="#FFEBB0" opacity="0.9"/>
  </g>
</svg>
